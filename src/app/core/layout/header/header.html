<header class="dashboard-header">
  <div class="brand">
    <h1>FaunaQC Studio</h1>
    <span class="subtitle">Animal Tracking Curation Engine</span>
  </div>
  <!-- User guidance instructions panel -->
  <div class="instructions-panel">
    <p>
      <strong>User Guide:</strong><br />
      <span
        >Upload telemetry or use mock data → Adjust Speed Limit to flag anomalies → Sessions
        auto-save automatically → Export clean data</span
      >
    </p>
  </div>
  <div class="actions">
    <!-- File upload trigger -->
    <input
      type="file"
      #fileInput
      style="display: none"
      accept=".csv,.json"
      (change)="onFileSelected($event)"
    />
    <button class="btn-primary" (click)="fileInput.click()">Upload Raw Data</button>
    <button class="btn-secondary" (click)="stateService.exportData('csv')">Export CSV</button>
    <button class="btn-secondary" (click)="stateService.exportData('json')">Export JSON</button>
  </div>
</header>
