<app-header />

<section class="toolbar">
  <div class="filter-group">
    <label>Individual:</label>
    <select
      [value]="stateService.filters().selectedIndividual"
      (change)="onIndividualChange($event)"
    >
      @for (id of stateService.availableIndividuals(); track id) {
        <option [value]="id">{{ id }}</option>
      }
    </select>
  </div>

  <div class="filter-group">
    <label>Speed Limit (km/h):</label>
    <input
      type="number"
      [value]="stateService.filters().maxSpeedThreshold"
      (input)="onSpeedLimitChange($event)"
    />
  </div>

  <div class="filter-group checkbox">
    <label>
      <input
        type="checkbox"
        [checked]="stateService.filters().showOnlyFlagged"
        (change)="onFlaggedToggle($event)"
      />
      Show Flagged Only
    </label>
  </div>

  @if (stateService.sessionRestored()) {
    <div class="restoration-banner">
      <span>Unfinished curation session restored from local storage</span>
      <div class="banner-actions">
        <button class="btn-primary btn-sm" (click)="stateService.dismissRestoration()">OK</button>
        <button class="btn-text" (click)="stateService.clearCurrentSession()">
          Discard & Start Fresh
        </button>
      </div>
    </div>
  }

  <div class="view-toggles">
    <button
      [class.active]="stateService.viewMode() === 'split'"
      (click)="stateService.setViewMode('split')"
    >
      Split
    </button>
    <button
      [class.active]="stateService.viewMode() === 'table-only'"
      (click)="stateService.setViewMode('table-only')"
    >
      Table
    </button>
    <button
      [class.active]="stateService.viewMode() === 'map-only'"
      (click)="stateService.setViewMode('map-only')"
    >
      Map
    </button>
  </div>
</section>

<main class="dashboard-content [stateService.viewMode()]">
  @if (stateService.viewMode() === 'split' || stateService.viewMode() === 'table-only') {
    <div class="pane">
      <app-data-grid
        [data]="stateService.filteredData()"
        [selectedId]="stateService.selectedPointId()"
        (select)="stateService.selectPoint($event)"
        (toggleOverride)="stateService.toggleOverride($event)"
        (deletePoint)="stateService.deletePoint($event)"
      />
    </div>
  }

  @if (stateService.viewMode() === 'split' || stateService.viewMode() === 'map-only') {
    <div class="pane">
      <app-map-inspector
        [data]="stateService.filteredData()"
        [selectedId]="stateService.selectedPointId()"
        (select)="stateService.selectPoint($event)"
      />
    </div>
  }
</main>

<app-footer />
